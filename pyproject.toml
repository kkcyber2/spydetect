[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spydetect"
version = "0.1.0"
description = "Detect host surveillance indicators: stalkerware names, camera/mic access, odd paths, unexpected listeners"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["security", "spyware", "stalkerware", "dfir", "privacy", "blue-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
spydetect = "spydetect.cli:main"

[tool.setuptools.packages.find]
include = ["spydetect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
