name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI on a synthetic snapshot
        run: |
          python -c "import json; json.dump({'processes':[{'pid':1,'name':'systemd','exe_path':'/usr/lib/systemd/systemd','signed':True},{'pid':4242,'name':'mspy-agent','exe_path':'/tmp/.hidden/agent','signed':False,'open_devices':['/dev/video0']}],'connections':[{'pid':4242,'local_port':31337,'state':'LISTEN'}]}, open('/tmp/snap.json','w'))"
          spydetect --from-json /tmp/snap.json --fail-on 70
